# nginx devant Ossuary : HTTPS + WebSocket (/ws).
# À copier dans /etc/nginx/sites-available/ossuary puis :
#   sudo ln -s /etc/nginx/sites-available/ossuary /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ossuary.fr -d www.ossuary.fr      (certificat HTTPS gratuit)
# Remplace ossuary.fr par ton nom de domaine.
server {
    listen 80;
    server_name ossuary.fr www.ossuary.fr;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket du jeu
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
